<div class="flight-filters">
  <div class="flight-filters__header">
    <h3 class="flight-filters__title">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
      </svg>
      Filters
    </h3>
    <button type="button" class="flight-filters__clear" (click)="onClearAll()">Clear All</button>
  </div>

  <!-- Price Range -->
  <div class="flight-filters__section">
    <div class="flight-filters__section-header">
      <span class="flight-filters__label">Price Range</span>
      <span class="flight-filters__price-display">${{ filters().priceMin }} – ${{ filters().priceMax }}</span>
    </div>
    <div class="flight-filters__slider-track">
      <input
        id="price-min"
        class="flight-filters__slider"
        type="range"
        min="0"
        max="1000"
        step="25"
        [value]="filters().priceMin"
        (input)="onPriceMin($event)"
        aria-label="Minimum price"
      />
    </div>
    <div class="flight-filters__slider-track">
      <input
        id="price-max"
        class="flight-filters__slider"
        type="range"
        min="0"
        max="1000"
        step="25"
        [value]="filters().priceMax"
        (input)="onPriceMax($event)"
        aria-label="Maximum price"
      />
    </div>
  </div>

  <!-- Number of Stops -->
  <div class="flight-filters__section">
    <span class="flight-filters__label">Number of Stops</span>
    <div class="flight-filters__options">
      @for (stops of stopOptions; track stops) {
        <label class="flight-filters__checkbox-label">
          <input
            type="checkbox"
            [checked]="filters().stops.includes(stops)"
            (change)="onStopsToggle(stops, $any($event.target).checked)"
          />
          <span class="flight-filters__checkbox-custom"></span>
          <span class="flight-filters__option-text">{{ stopLabels[stops] }}</span>
        </label>
      }
    </div>
  </div>

  <!-- Airline -->
  <div class="flight-filters__section">
    <span class="flight-filters__label">Airline</span>
    <div class="flight-filters__search-box">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input
        type="text"
        placeholder="Search airline"
        class="flight-filters__search-input"
        [value]="airlineSearchTerm"
        (input)="onAirlineSearch($event)"
        aria-label="Search airlines"
      />
    </div>
    <div class="flight-filters__options flight-filters__options--airlines">
      @for (airline of filteredAirlines; track airline) {
        <label class="flight-filters__checkbox-label">
          <input
            type="checkbox"
            [checked]="filters().airlines.includes(airline)"
            (change)="onAirlineToggle(airline, $any($event.target).checked)"
          />
          <span class="flight-filters__checkbox-custom"></span>
          <span class="flight-filters__option-text">{{ airline }}</span>
        </label>
      }
    </div>
  </div>
</div>
